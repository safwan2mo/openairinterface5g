#
# CU-CP configuration for the 2-gNB rfsim Xn handover pipeline
# (ci-scripts/xml_files/container_5g_rfsim_xn_ho.xml).
#
# Both CU-CPs (source gNB_ID 0xe00 / target gNB_ID 0xb00) mount this same file;
# the per-instance differences (gNB_ID, nr_cellid, E1/NG/Xn addresses) are applied
# as --gNBs.[0].* command-line overrides from the docker-compose file, exactly as
# the N2 handover pipeline does with gnb-cucp.sa.e1-ho-n2.conf.
#
# NOTE: the Xn_INTERFACE block below describes the *intended* schema. OAI currently
# ships only the XnAP ASN.1 codec (openair2/XNAP/lib) + unit tests; there is no XnAP
# SCTP task yet, so this block is parsed-but-inert until the Xn runtime path lands.

Active_gNBs = ( "cu-cp-0");
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID = 0xe00;
    gNB_name  =  "cu-cp-0";

    tracking_area_code  =  1;
    plmn_list = ({ mcc = 208; mnc = 99; mnc_length = 2; snssaiList = ({ sst = 1, sd = 0xffffff }) });
    @include "neighbour-config.conf"

    nr_cellid = 12345678L;

    tr_s_preference = "f1";

    local_s_address  = "192.168.71.150";
    remote_s_address = "192.168.71.171";
    local_s_portd    = 2153;
    remote_s_portd   = 2153;

    # ------- SCTP definitions
    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    ////////// AMF parameters:
    amf_ip_address = ({ ipv4 = "192.168.71.132"; });

    E1_INTERFACE =
    (
      {
        type      = "cp";
        ipv4_cucp = "192.168.71.150";
        port_cucp = 38462;
        ipv4_cuup = "0.0.0.0"; # multiple CU-UPs
        port_cuup = 38462;
      }
    )

    ////////// Xn parameters (proposed schema, see note at top of file):
    #   ipv4_local  / port_local  : this CU-CP's XnAP SCTP endpoint
    #   ipv4_remote / port_remote : the peer gNB CU-CP's XnAP SCTP endpoint
    # Overridden per instance from docker-compose so that 0xe00 <-> 0xb00 peer each other.
    Xn_INTERFACE =
    (
      {
        ipv4_local  = "192.168.71.150";
        port_local  = 38422;
        ipv4_remote = "192.168.71.180";
        port_remote = 38422;
      }
    )

    NETWORK_INTERFACES :
    {
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "192.168.71.150";
    };
  }
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config : {
  global_log_level = "info";
  pdcp_log_level   = "info";
  rrc_log_level    = "info";
  f1ap_log_level   = "info";
  ngap_log_level   = "info";
  # xnap_log_level = "debug";  # enable once the XnAP task exists, for message-step tracing
};
